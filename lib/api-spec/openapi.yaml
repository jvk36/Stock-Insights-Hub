openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Stock Research Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Stock data operations
  - name: macro
    description: Macroeconomic indicator operations
  - name: indexes
    description: Market index constituent operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stock/{symbol}/quote:
    get:
      operationId: getStockQuote
      tags: [stock]
      summary: Get stock quote and summary stats
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock quote data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockQuote"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/chart:
    get:
      operationId: getStockChart
      tags: [stock]
      summary: Get stock price chart data
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, max]
            default: 1y
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartData"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/news:
    get:
      operationId: getStockNews
      tags: [stock]
      summary: Get news for a stock
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: News items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/profile:
    get:
      operationId: getStockProfile
      tags: [stock]
      summary: Get company profile
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/financials:
    get:
      operationId: getStockFinancials
      tags: [stock]
      summary: Get financial statements
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [quarterly, annual]
            default: quarterly
      responses:
        "200":
          description: Financial statements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/earnings-history:
    get:
      operationId: getEarningsHistory
      tags: [stock]
      summary: Get historical quarterly EPS data for earnings overlay
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Earnings history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsHistoryResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/buyback-history:
    get:
      operationId: getBuybackHistory
      tags: [stock]
      summary: Get quarterly share count, buyback, issuance, and price history
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approximately ten years of quarterly capital activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackHistoryResponse"
        "404":
          description: Symbol or SEC registrant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Failed to fetch buyback history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/insider-transactions:
    get:
      operationId: getInsiderTransactions
      tags: [stock]
      summary: Get insider transactions (Form 4) for a company
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Zero-based three-month filing window, with page 0 being the newest window
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Insider transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsiderTransactionsResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/fundamentals:
    get:
      operationId: getStockFundamentals
      tags: [stock]
      summary: Get fundamental analysis summary (4 pillars)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fundamental summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalSummary"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/analysis:
    get:
      operationId: getStockAnalysis
      tags: [stock]
      summary: Get DCF inputs and MOAT analysis data (5 years)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis data including DCF inputs and MOAT metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAnalysis"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/models:
    get:
      operationId: getStockModels
      tags: [stock]
      summary: Get raw data for valuation models (Graham, EV/EBIT, DDM)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Valuation model input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockModels"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/screener-ratings:
    get:
      operationId: getStockScreenerRatings
      tags: [stock]
      summary: Get raw metrics for 5-strategy screener scoring
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Raw screener metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenerData"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/indicators:
    get:
      operationId: getStockIndicators
      tags: [stock]
      summary: Get market signal indicators for a stock
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market signal indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockIndicators"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /macro/indicators:
    get:
      operationId: getMacroIndicators
      tags: [macro]
      summary: Get latest values for all macro economic indicators
      responses:
        "200":
          description: Macro indicators with latest values and signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacroIndicatorsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/sp500:
    get:
      operationId: getIndexSp500
      tags: [indexes]
      summary: Get all S&P 500 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: S&P 500 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/nasdaq100:
    get:
      operationId: getIndexNasdaq100
      tags: [indexes]
      summary: Get all Nasdaq-100 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: Nasdaq-100 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/sp400:
    get:
      operationId: getIndexSp400
      tags: [indexes]
      summary: Get all S&P MidCap 400 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: S&P MidCap 400 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/sp600:
    get:
      operationId: getIndexSp600
      tags: [indexes]
      summary: Get all S&P SmallCap 600 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: S&P SmallCap 600 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/djia:
    get:
      operationId: getIndexDjia
      tags: [indexes]
      summary: Get all Dow Jones Industrial Average constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: DJIA constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/adrs:
    get:
      operationId: getIndexAdrs
      tags: [indexes]
      summary: Get top ADRs listed on NYSE and NASDAQ
      description: Returns sponsored ADRs listed on NYSE/NASDAQ sourced from BNY Mellon DR Directory. The sector field holds the country name; industry holds the BNY industry classification. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: Top ADR list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "503":
          description: Failed to fetch data from BNY Mellon DR Directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/{indexId}/metrics:
    get:
      operationId: getIndexMetrics
      tags: [indexes]
      summary: Get financial metrics for all constituents of an index
      description: >
        Returns Yahoo Finance financial metrics for each constituent of the specified index,
        used to power the screener range-slider panels (GARP, Deep Value, Momentum, Quality,
        Dividend Growth). Enrichment runs in the background after the constituent list loads.
        Returns metricsReady=false while enrichment is still in progress.
        Results are cached for 24 hours (stale-while-revalidate).
      parameters:
        - name: indexId
          in: path
          required: true
          description: Index identifier
          schema:
            type: string
            enum: [sp500, nasdaq100, sp400, sp600, djia, adrs]
      responses:
        "200":
          description: Index metrics response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexMetricsResponse"
        "404":
          description: Unknown index ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /macro/series/{seriesId}/observations:
    get:
      operationId: getMacroSeriesObservations
      tags: [macro]
      summary: Get historical observations for a FRED series (for charts)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
        - name: units
          in: query
          required: false
          schema:
            type: string
            enum: [lin, chg, ch1, pch, pc1, pca, cch, cca, log]
            default: lin
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 120
      responses:
        "200":
          description: Series observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FredObservationsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/sec-filings:
    get:
      operationId: getSecFilings
      tags: [stock]
      summary: Get SEC filings for a company
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SEC filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecFilingsResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/funds:
    get:
      operationId: list13fFunds
      tags: [thirteenf]
      summary: List all tracked hedge funds
      responses:
        "200":
          description: List of tracked hedge funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HedgeFundsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/funds/{cik}/quarters:
    get:
      operationId: get13fFundQuarters
      tags: [thirteenf]
      summary: List available 13F filing quarters for a hedge fund
      parameters:
        - name: cik
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available quarters newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThirteenFQuartersResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/funds/{cik}/holdings:
    get:
      operationId: get13fFundHoldings
      tags: [thirteenf]
      summary: Get quarter-over-quarter 13F holdings comparison for a hedge fund
      parameters:
        - name: cik
          in: path
          required: true
          schema:
            type: string
        - name: currentQ
          in: query
          required: false
          schema:
            type: string
          description: Current quarter label (e.g. "Q1 2026"). Defaults to most recent.
        - name: priorQ
          in: query
          required: false
          schema:
            type: string
          description: Prior quarter label (e.g. "Q4 2025"). Defaults to quarter preceding currentQ.
      responses:
        "200":
          description: Holdings comparison data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThirteenFHoldingsResponse"
        "404":
          description: Fund or quarter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/price-info:
    get:
      operationId: get13fPriceInfo
      tags: [thirteenf]
      summary: Get current share price and quarterly price range for a ticker
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          description: Stock ticker symbol (e.g. "GOOGL")
        - name: quarter
          in: query
          required: true
          schema:
            type: string
          description: Quarter label (e.g. "Q1 2026")
      responses:
        "200":
          description: Price info for the ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPriceInfo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    StockQuote:
      type: object
      properties:
        symbol:
          type: string
        shortName:
          type: string
        longName:
          type: string
        currentPrice:
          type: number
          nullable: true
        previousClose:
          type: number
          nullable: true
        open:
          type: number
          nullable: true
        dayHigh:
          type: number
          nullable: true
        dayLow:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        averageVolume:
          type: number
          nullable: true
        marketCap:
          type: number
          nullable: true
        enterpriseValue:
          type: number
          nullable: true
        trailingPE:
          type: number
          nullable: true
        forwardPE:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
        beta:
          type: number
          nullable: true
        priceToBook:
          type: number
          nullable: true
        netDebt:
          type: number
          nullable: true
        totalDebt:
          type: number
          nullable: true
        totalCash:
          type: number
          nullable: true
        revenueGrowth:
          type: number
          nullable: true
        earningsGrowth:
          type: number
          nullable: true
        profitMargins:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        exchange:
          type: string
          nullable: true
      required:
        - symbol
        - shortName

    ChartDataPoint:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
          nullable: true
        high:
          type: number
          nullable: true
        low:
          type: number
          nullable: true
        close:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
      required:
        - date

    ChartData:
      type: object
      properties:
        symbol:
          type: string
        range:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
      required:
        - symbol
        - range
        - data

    NewsItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        publisher:
          type: string
        link:
          type: string
        publishedAt:
          type: string
        thumbnail:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
      required:
        - id
        - title
        - publisher
        - link
        - publishedAt

    NewsResponse:
      type: object
      properties:
        symbol:
          type: string
        news:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
      required:
        - symbol
        - news

    CompanyProfile:
      type: object
      properties:
        symbol:
          type: string
        longName:
          type: string
        sector:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        employees:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
      required:
        - symbol
        - longName

    FinancialPeriod:
      type: object
      properties:
        date:
          type: string
        data:
          type: object
          additionalProperties:
            type: number
            nullable: true
      required:
        - date
        - data

    FinancialStatements:
      type: object
      properties:
        symbol:
          type: string
        period:
          type: string
        financialCurrency:
          type: string
          nullable: true
        incomeStatement:
          type: array
          items:
            $ref: "#/components/schemas/FinancialPeriod"
        balanceSheet:
          type: array
          items:
            $ref: "#/components/schemas/FinancialPeriod"
        cashFlow:
          type: array
          items:
            $ref: "#/components/schemas/FinancialPeriod"
      required:
        - symbol
        - period
        - incomeStatement
        - balanceSheet
        - cashFlow

    EarningsHistoryItem:
      type: object
      properties:
        date:
          type: string
        epsActual:
          type: number
          nullable: true
        epsEstimate:
          type: number
          nullable: true
        ttmEps:
          type: number
          nullable: true
      required:
        - date

    EarningsHistoryResponse:
      type: object
      properties:
        symbol:
          type: string
        peMultiple:
          type: number
        history:
          type: array
          items:
            $ref: "#/components/schemas/EarningsHistoryItem"
      required:
        - symbol
        - peMultiple
        - history

    BuybackHistoryItem:
      type: object
      properties:
        date:
          type: string
        sharesOutstanding:
          type: ["number", "null"]
          description: Reported common shares outstanding near the quarter end
        repurchasedShares:
          type: ["number", "null"]
          description: Shares repurchased during the quarter, reported where possible and otherwise estimated from cash paid and quarter price
        issuedShares:
          type: ["number", "null"]
          description: Shares issued during the quarter, reported where possible and otherwise estimated from issuance proceeds or share-count movement
        pricePerShare:
          type: ["number", "null"]
          description: Adjusted market close nearest the filing quarter end
        repurchaseQuality:
          type: string
          enum: [reported, estimated, unavailable]
        issuanceQuality:
          type: string
          enum: [reported, estimated, unavailable]
      required:
        - date
        - sharesOutstanding
        - repurchasedShares
        - issuedShares
        - pricePerShare
        - repurchaseQuality
        - issuanceQuality

    BuybackHistoryCoverage:
      type: object
      properties:
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        quarterCount:
          type: integer
        estimatedQuarterCount:
          type: integer
        note:
