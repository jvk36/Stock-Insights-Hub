openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Stock Research Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Stock data operations
  - name: macro
    description: Macroeconomic indicator operations
  - name: indexes
    description: Market index constituent operations
  - name: watchlist
    description: Premium personal watchlist operations
paths:
  /model-portfolios/magic-formula:
    get:
      operationId: getMagicFormulaPortfolio
      tags: [ModelPortfolios]
      summary: Staggered annual Magic Formula portfolio (Premium)
      responses:
        "200":
          description: Frozen annual rankings, cohorts and transaction ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicFormulaPortfolio"
        "401":
          description: Sign in required
        "403":
          description: Premium required
        "503":
          description: Portfolio temporarily unavailable
  /model-portfolios/cloning:
    get:
      operationId: getCloningPortfolio
      tags: [ModelPortfolios]
      summary: Quarterly point-in-time 13F cloning portfolio (Premium)
      responses:
        "200":
          description: Cloning model, manager picks and persisted execution history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloningPortfolio"
        "401":
          description: Sign in required
        "403":
          description: Premium required
        "503":
          description: Verified data temporarily unavailable
  /model-portfolios/{strategy}/backtest:
    get:
      operationId: getModelPortfolioBacktest
      tags: [ModelPortfolios]
      summary: Ten-year pre-inception ETF strategy backtest (Premium)
      parameters:
        - in: path
          name: strategy
          required: true
          schema: { type: string, enum: [momentum, lazy, blind-trust, cloning] }
      responses:
        "200":
          description: Historical simulation, performance and every rebalance allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPortfolioBacktest"
        "401":
          description: Sign in required
        "403":
          description: Premium required
        "503":
          description: Historical data temporarily unavailable
  /model-portfolios/lazy:
    get:
      operationId: getLazyPortfolio
      tags: [ModelPortfolios]
      summary: Shared quarterly fixed-weight Swensen-inspired ETF model (Premium)
      responses:
        "200":
          description: Persisted Lazy strategy, holdings and performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LazyPortfolio"
        "401":
          description: Sign in required
        "403":
          description: Premium required
        "503":
          description: Portfolio temporarily unavailable
  /model-portfolios/momentum:
    get:
      operationId: getMomentumPortfolio
      tags: [ModelPortfolios]
      summary: Shared quarterly 200-day SMA ETF model (Premium)
      responses:
        "200":
          description: Persisted Momentum strategy and current signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentumPortfolio"
        "401":
          description: Sign in required
        "403":
          description: Premium required
        "503":
          description: Portfolio temporarily unavailable
  /model-portfolios/blind-trust:
    get:
      operationId: getBlindTrustPortfolio
      tags: [ModelPortfolios]
      summary: Shared Blind Trust strategy, holdings and performance (Premium)
      responses:
        "200":
          description: Persisted model portfolio and current candidate ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlindTrustPortfolio"
        "401":
          description: Sign in required
        "403":
          description: Premium required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      responses:
        "200":
          description: Current user's watchlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchlistEntry" }
  /watchlist/add:
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker: { type: string }
      responses:
        "201":
          description: Added entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistEntry" }
  /watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
  /watchlist/bulk-metrics:
    get:
      operationId: getWatchlistMetrics
      tags: [watchlist]
      responses:
        "200":
          description: Latest metrics for each watchlist symbol
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchlistMetrics" }
  /stocks/{ticker}/history:
    get:
      operationId: getWatchlistStockHistory
      tags: [watchlist]
      parameters:
        - { name: ticker, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, required: false, schema: { type: string, enum: [1mo, 3mo, 6mo, 1y, 2y], default: 6mo } }
      responses:
        "200":
          description: Historical metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockHistory" }

  /stock/{symbol}/quote:
    get:
      operationId: getStockQuote
      tags: [stock]
      summary: Get stock quote and summary stats
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock quote data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockQuote"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/chart:
    get:
      operationId: getStockChart
      tags: [stock]
      summary: Get stock price chart data
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, max]
            default: 1y
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartData"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/news:
    get:
      operationId: getStockNews
      tags: [stock]
      summary: Get news for a stock
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: News items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/profile:
    get:
      operationId: getStockProfile
      tags: [stock]
      summary: Get company profile
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/board-leadership:
    get:
      operationId: getBoardLeadership
      tags: [stock]
      summary: Get current executives, board members, elections, and activist campaign signals
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board and leadership data compiled from Yahoo Finance and SEC proxy filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardLeadershipResponse"
        "404":
          description: Symbol or company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Failed to compile board and leadership data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/financials:
    get:
      operationId: getStockFinancials
      tags: [stock]
      summary: Get financial statements
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [quarterly, annual]
            default: quarterly
      responses:
        "200":
          description: Financial statements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/earnings-history:
    get:
      operationId: getEarningsHistory
      tags: [stock]
      summary: Get historical quarterly EPS data for earnings overlay
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Earnings history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsHistoryResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/buyback-history:
    get:
      operationId: getBuybackHistory
      tags: [stock]
      summary: Get quarterly share count, buyback, issuance, and price history
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approximately ten years of quarterly capital activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackHistoryResponse"
        "404":
          description: Symbol or SEC registrant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Failed to fetch buyback history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/insider-transactions:
    get:
      operationId: getInsiderTransactions
      tags: [stock]
      summary: Get insider transactions (Form 4) for a company
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Zero-based three-month filing window, with page 0 being the newest window
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Insider transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsiderTransactionsResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/fundamentals:
    get:
      operationId: getStockFundamentals
      tags: [stock]
      summary: Get fundamental analysis summary (4 pillars)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fundamental summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalSummary"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/analysis:
    get:
      operationId: getStockAnalysis
      tags: [stock]
      summary: Get DCF inputs and MOAT analysis data (5 years)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis data including DCF inputs and MOAT metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAnalysis"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/models:
    get:
      operationId: getStockModels
      tags: [stock]
      summary: Get raw data for valuation models (Graham, EV/EBIT, DDM)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Valuation model input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockModels"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/screener-ratings:
    get:
      operationId: getStockScreenerRatings
      tags: [stock]
      summary: Get raw metrics for 5-strategy screener scoring
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Raw screener metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenerData"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/indicators:
    get:
      operationId: getStockIndicators
      tags: [stock]
      summary: Get market signal indicators for a stock
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market signal indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockIndicators"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /macro/indicators:
    get:
      operationId: getMacroIndicators
      tags: [macro]
      summary: Get latest values for all macro economic indicators
      responses:
        "200":
          description: Macro indicators with latest values and signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacroIndicatorsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/sp500:
    get:
      operationId: getIndexSp500
      tags: [indexes]
      summary: Get all S&P 500 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: S&P 500 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/nasdaq100:
    get:
      operationId: getIndexNasdaq100
      tags: [indexes]
      summary: Get all Nasdaq-100 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: Nasdaq-100 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/sp400:
    get:
      operationId: getIndexSp400
      tags: [indexes]
      summary: Get all S&P MidCap 400 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: S&P MidCap 400 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/sp600:
    get:
      operationId: getIndexSp600
      tags: [indexes]
      summary: Get all S&P SmallCap 600 constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: S&P SmallCap 600 constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/djia:
    get:
      operationId: getIndexDjia
      tags: [indexes]
      summary: Get all Dow Jones Industrial Average constituents
      description: Returns ticker symbols, company names, and sectors scraped from Wikipedia. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: DJIA constituent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "502":
          description: Failed to fetch data from Wikipedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/adrs:
    get:
      operationId: getIndexAdrs
      tags: [indexes]
      summary: Get top ADRs listed on NYSE and NASDAQ
      description: Returns sponsored ADRs listed on NYSE/NASDAQ sourced from BNY Mellon DR Directory. The sector field holds the country name; industry holds the BNY industry classification. Stale-while-revalidate, 24-hour TTL.
      responses:
        "200":
          description: Top ADR list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexConstituentsResponse"
        "503":
          description: Failed to fetch data from BNY Mellon DR Directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /indexes/{indexId}/metrics:
    get:
      operationId: getIndexMetrics
      tags: [indexes]
      summary: Get financial metrics for all constituents of an index
      description: >
        Returns Yahoo Finance financial metrics for each constituent of the specified index,
        used to power the screener range-slider panels (GARP, Deep Value, Momentum, Quality,
        Dividend Growth). Enrichment runs in the background after the constituent list loads.
        Returns metricsReady=false while enrichment is still in progress.
        Results are cached for 24 hours (stale-while-revalidate).
      parameters:
        - name: indexId
          in: path
          required: true
          description: Index identifier
          schema:
            type: string
            enum: [sp500, nasdaq100, sp400, sp600, djia, adrs]
      responses:
        "200":
          description: Index metrics response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexMetricsResponse"
        "404":
          description: Unknown index ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /macro/series/{seriesId}/observations:
    get:
      operationId: getMacroSeriesObservations
      tags: [macro]
      summary: Get historical observations for a FRED series (for charts)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
        - name: units
          in: query
          required: false
          schema:
            type: string
            enum: [lin, chg, ch1, pch, pc1, pca, cch, cca, log]
            default: lin
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 120
      responses:
        "200":
          description: Series observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FredObservationsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock/{symbol}/sec-filings:
    get:
      operationId: getSecFilings
      tags: [stock]
      summary: Get SEC filings for a company
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SEC filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecFilingsResponse"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/funds:
    get:
      operationId: list13fFunds
      tags: [thirteenf]
      summary: List all tracked hedge funds
      responses:
        "200":
          description: List of tracked hedge funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HedgeFundsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/funds/{cik}/quarters:
    get:
      operationId: get13fFundQuarters
      tags: [thirteenf]
      summary: List available 13F filing quarters for a hedge fund
      parameters:
        - name: cik
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available quarters newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThirteenFQuartersResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/funds/{cik}/holdings:
    get:
      operationId: get13fFundHoldings
      tags: [thirteenf]
      summary: Get quarter-over-quarter 13F holdings comparison for a hedge fund
      parameters:
        - name: cik
          in: path
          required: true
          schema:
            type: string
        - name: currentQ
          in: query
          required: false
          schema:
            type: string
          description: Current quarter label (e.g. "Q1 2026"). Defaults to most recent.
        - name: priorQ
          in: query
          required: false
          schema:
            type: string
          description: Prior quarter label (e.g. "Q4 2025"). Defaults to quarter preceding currentQ.
      responses:
        "200":
          description: Holdings comparison data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThirteenFHoldingsResponse"
        "404":
          description: Fund or quarter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /13f/price-info:
    get:
      operationId: get13fPriceInfo
      tags: [thirteenf]
      summary: Get current share price and quarterly price range for a ticker
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          description: Stock ticker symbol (e.g. "GOOGL")
        - name: quarter
          in: query
          required: true
          schema:
            type: string
          description: Quarter label (e.g. "Q1 2026")
      responses:
        "200":
          description: Price info for the ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPriceInfo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    BlindTrustCandidate:
      type: object
      required: [ticker, name, providerSymbol, price, bookValue, priceToBook, priceDate, bookDate, observedAt, status, reason, rank, selected]
      properties:
        ticker: { type: string }
        name: { type: string }
        providerSymbol: { type: string }
        price: { type: [number, "null"] }
        bookValue: { type: [number, "null"] }
        priceToBook: { type: [number, "null"] }
        priceDate: { type: [string, "null"] }
        bookDate: { type: [string, "null"] }
        bookSource: { type: [string, "null"] }
        bookValueLabel: { type: [string, "null"] }
        observedAt: { type: string }
        status: { type: string, enum: [eligible, ineligible, unavailable, temporary_error] }
        reason: { type: [string, "null"] }
        rank: { type: [integer, "null"] }
        selected: { type: boolean }
    BlindTrustHolding:
      type: object
