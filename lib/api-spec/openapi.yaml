          nullable: true
      required:
        - cik
        - name
        - slug

    HedgeFundsResponse:
      type: object
      properties:
        funds:
          type: array
          items:
            $ref: "#/components/schemas/HedgeFund"
      required:
        - funds

    StockPriceInfo:
      type: object
      properties:
        ticker:
          type: string
        quarter:
          type: string
        currentPrice:
          type: number
          nullable: true
          description: Current market price
        quarterHigh:
          type: number
          nullable: true
          description: Highest daily high during the quarter
        quarterLow:
          type: number
          nullable: true
          description: Lowest daily low during the quarter
        currency:
          type: string
          description: Currency code (e.g. "USD")
      required:
        - ticker
        - quarter
        - currency

    ThirteenFQuartersResponse:
      type: object
      properties:
        cik:
          type: string
        quarters:
          type: array
          items:
            type: string
          description: Quarter labels newest first (e.g. ["Q1 2026", "Q4 2025", ...])
        seedingInProgress:
          type: boolean
          description: True when the fund is registered but holdings are still being fetched from EDGAR on first load
      required:
        - cik
        - quarters

    ThirteenFHoldingRow:
      type: object
      properties:
        name:
          type: string
          description: Issuer name from 13F (deduplicated)
        ticker:
          type: string
          nullable: true
          description: Resolved ticker symbol (null if CUSIP lookup failed)
        cusip:
          type: string
        currentMarketValue:
          type: number
          nullable: true
          description: Market value in dollars for the current quarter (null if exited)
        currentShares:
          type: number
          nullable: true
          description: Shares held in the current quarter (null if exited)
        currentPctAllocation:
          type: number
          nullable: true
          description: Percentage of total portfolio (current quarter, null if exited)
        priorMarketValue:
          type: number
          nullable: true
          description: Market value in dollars for the prior quarter (null if new position)
        priorShares:
          type: number
          nullable: true
          description: Shares held in the prior quarter (null if new position)
        priorPctAllocation:
          type: number
          nullable: true
          description: Percentage of total portfolio (prior quarter)
        pctChangeShares:
          type: number
          nullable: true
          description: Percentage change in shares vs prior quarter (null if new position)
        colorClass:
          type: string
          description: "Color coding: new | increase-high | increase-low | decrease-high | decrease-low | empty string"
      required:
        - name
        - cusip
        - currentMarketValue
        - currentShares
        - currentPctAllocation
        - colorClass

    ThirteenFHoldingsResponse:
      type: object
      properties:
        fundName:
          type: string
        proprietor:
          type: string
          nullable: true
        cik:
          type: string
        currentQ:
          type: string
          nullable: true
        priorQ:
          type: string
          nullable: true
        currentTotalValue:
          type: number
          description: Total portfolio value in dollars for the current quarter
        priorTotalValue:
          type: number
          nullable: true
          description: Total portfolio value in dollars for the prior quarter
        seedingInProgress:
          type: boolean
          description: True if the initial data fetch from SEC EDGAR has not completed yet
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/ThirteenFHoldingRow"
      required:
        - fundName
        - cik
        - currentTotalValue
        - seedingInProgress
        - holdings
